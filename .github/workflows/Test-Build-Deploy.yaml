name: Test-Build-Deploy

on:
  push:
    branches:
      - main

jobs:
  build-job:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate Static Site
        id: generate-static-site
        run: |
          ./scripts/gen-site.sh

      - name: Upload Static Site as an Artifact
        id: upload-static-site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./gen/

  # github recommends doing the deployment as a separate job, not sure why

  deploy-job:
    runs-on: ubuntu-latest
    needs: build-job

    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.upload-static-site.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-to-github-pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
