name: Test-Build-Deploy

on:
  push:
    branches:
      - main

jobs:
  build-job:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Static Site
        id: generate-static-site
        run: |
          ./scripts/gen-site.sh

      - name: Upload Static Site as an Artifact
        id: upload-static-site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./gen/

  # github recommends doing the deployment as a separate job, not sure why

  deploy-job:
    runs-on: ubuntu-latest
    needs: build-job

    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.upload-static-site.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-to-github-pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
